name: Responder "comenta QUERO" + publicar no horário
# O agendamento do GitHub atrasa muito (*/5 rodava ~1x por hora). Por isso cada execução
# fica ~50 min no ar checando os comentários a cada 60 s, e uma nova entra a cada 30 min.
on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "1 = só lista, não responde"
        default: "0"
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: Responder comentários pedindo os links (a cada 60 s por ~50 min)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TESTE: ${{ github.event.inputs.teste }}
        run: |
          git config user.name "robo-achadinhos"
          git config user.email "robo-achadinhos@users.noreply.github.com"
          fim=$(( $(date +%s) + 50*60 ))
          while [ $(date +%s) -lt $fim ]; do
            git pull --rebase -q || true
            if [ "$TESTE" != "1" ]; then
              python3 publicar/publicar.py || echo "publicar falhou esta rodada"
              python3 producao/paginas.py vitrine || true
            fi
            python3 publicar/responder.py || echo "falhou esta rodada"
            git add publicar/respondidos.json publicar/fila.json docs/index.html
            git diff --cached --quiet || (git commit -q -m "Robô: QUERO/publicação $(date -u +%FT%TZ)" && (git push -q || (git pull --rebase -q && git push -q)))
            [ "$TESTE" = "1" ] && break
            sleep 60
          done
