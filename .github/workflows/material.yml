name: Baixar fotos dos posts
on:
  push:
    paths: ["producao/material_pedido.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: material
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python3 producao/baixar_material.py
      - run: |
          git config user.name "robo-achadinhos"
          git config user.email "robo-achadinhos@users.noreply.github.com"
          git add producao/material
          git diff --cached --quiet || (git commit -q -m "Fotos dos posts" && git pull --rebase -q && git push -q)
