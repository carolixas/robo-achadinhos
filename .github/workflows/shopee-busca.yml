name: Shopee busca (API oficial)
on:
  workflow_dispatch:
    inputs:
      termos:
        description: "termos separados por vírgula"
        default: "vaso decorativo, luminaria de mesa"
permissions:
  contents: write
concurrency:
  group: shopee-busca
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar (mais vendidos, com link de afiliado pronto)
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: python3 shopee/api.py salvar "${{ github.event.inputs.termos }}"
      - name: Guardar
        run: |
          git config user.name "robo-achadinhos"
          git config user.email "robo-achadinhos@users.noreply.github.com"
          git add producao/shopee_busca.json
          git diff --cached --quiet || (git commit -q -m "Shopee: busca pela API" && git pull --rebase -q && git push -q)
