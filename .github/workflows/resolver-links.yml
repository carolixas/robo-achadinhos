name: Resolver links curtos (diagnóstico)
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read u; do
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' -A "Mozilla/5.0" "$u")
            echo "RES $u $loc"
          done < producao/links_resolver.txt
